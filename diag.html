<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic Onde</title>
<body style="font:14px system-ui;background:#100d18;color:#f4efe6;padding:16px">
<h2>Diagnostic de lecture Onde</h2><pre id="o" style="white-space:pre-wrap;word-break:break-all"></pre>
<audio id="a" controls style="width:100%"></audio>
<script>
const o=document.getElementById('o'),log=s=>o.textContent+=s+'\n\n';
(async()=>{
 const API='https://api.audius.co/v1',q='app_name=OndeMusique';
 try{
  const r=await fetch(`${API}/tracks/trending?${q}&limit=1`);log('trending: HTTP '+r.status);
  const j=await r.json();const t=j.data&&j.data[0];
  log('track: '+JSON.stringify({id:t.id,title:t.title,is_streamable:t.is_streamable,is_stream_gated:t.is_stream_gated,stream:t.stream,access:t.access}));
  try{const r2=await fetch(`${API}/tracks/${t.id}/stream?${q}&no_redirect=true`);log('stream no_redirect: HTTP '+r2.status+'\n'+(await r2.text()).slice(0,500));}catch(e){log('stream no_redirect: ERREUR '+e)}
  try{const r3=await fetch(`${API}/tracks/${t.id}/stream?${q}`,{method:'GET'});log('stream direct: HTTP '+r3.status+' type='+r3.headers.get('content-type')+' url='+r3.url);}catch(e){log('stream direct: ERREUR '+e)}
  try{const r4=await fetch('https://api.audius.co');log('hosts: '+(await r4.text()).slice(0,300));}catch(e){log('hosts: ERREUR '+e)}
  const a=document.getElementById('a');a.src=`${API}/tracks/${t.id}/stream?${q}`;
  a.onerror=()=>log('audio element: ERREUR code '+(a.error&&a.error.code));a.oncanplay=()=>log('audio element: OK, lecture possible');
 }catch(e){log('ERREUR '+e)}
})();
</script>
